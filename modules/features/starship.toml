"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
palette = "noctalia"

format = """
[╭─](overlay1) $directory $git_branch$git_status $nix_shell $fill $cmd_duration $time
[╰─](overlay1)$status$jobs$shlvl$character
"""

################################################################################
# Directory
################################################################################

[directory]
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1
truncation_symbol = "…/"
style = "bold crust bg:blue"
format = "[](blue)[ 󰉋 $path ]($style)[](blue)"
read_only = " 󰌾"
read_only_style = "bold crust bg:blue"

################################################################################
# Git (branch + status share one continuous pill)
################################################################################

[git_branch]
symbol = " "
style = "bold text bg:overlay1"
format = "[](overlay1)[ $symbol$branch]($style)"

[git_status]
style = "bold text bg:overlay1"
format = "([ $all_status$ahead_behind ]($style))[](overlay1)"

ahead = "⇡"
behind = "⇣"
diverged = "⇕"
modified = "~"
deleted = "✕"
staged = "+"
untracked = "?"
renamed = "»"
conflicted = "!"

################################################################################
# Right side
################################################################################

[fill]
symbol = " "

[cmd_duration]
min_time = 1000
style = "bold text bg:base"
format = "[](base)[ 󱎫 $duration ]($style)[](base)"

[time]
disabled = false
time_format = "%H:%M"
style = "bold crust bg:yellow"
format = "[](yellow)[ 󰥔 $time ]($style)[](yellow)"

################################################################################
# Prompt line (extra bells: exit code, background jobs, shell nesting)
################################################################################

[character]
success_symbol = "[❯❯](bold blue)"
error_symbol = "[❯❯](bold red)"
vimcmd_symbol = "[❮❮](bold text)"

[status]
disabled = false
format = "[ $symbol$status]($style) "
symbol = "✕"
style = "bold red"

[jobs]
disabled = false
symbol = " "
style = "bold text"
format = "[$symbol$number]($style) "

[shlvl]
disabled = false
threshold = 2
symbol = "❯"
style = "bold text"
format = "[$symbol$shlvl]($style) "

################################################################################
# Nix
################################################################################

[nix_shell]
disabled = false
symbol = " "
style = "bold crust bg:green"
format = "[](green)[ $symbol$name ]($style)[](green)"

################################################################################
# Disabled modules
################################################################################

[username]
disabled = true

[hostname]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[c]
disabled = true

[package]
disabled = true

[docker_context]
disabled = true

[kubernetes]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[terraform]
disabled = true
