"$schema" = 'https://starship.rs/config-schema.json'

# Palette comes from Noctalia. The activation script in
# modules/shells/noctalia.nix appends it to ~/.config/starship.toml.
palette = "noctalia"

add_newline = true
command_timeout = 1000

format = """
[╭─](overlay0)\
$os\
$directory\
$git_branch\
$git_status\
$git_metrics\
$nix_shell\
$direnv\
$fill\
$c$golang$java$lua$nodejs$python$rust\
$docker_context\
$jobs\
$status\
$cmd_duration\
$time\
$line_break\
[╰─](overlay0)$character"""

################################################################################
# Left side
################################################################################

[os]
disabled = false
style = "blue bold bg:surface1"
format = "[](surface1)[ $symbol ]($style)[](surface1)"

[os.symbols]
NixOS = ""
Linux = ""

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
read_only = " "
read_only_style = "red bold bg:blue"
style = "crust bold bg:blue"
format = "[](blue)[  $path$read_only ]($style)[](blue)"

[git_branch]
symbol = ""
style = "lavender bold bg:surface1"
format = "[](surface1)[ $symbol $branch ]($style)[](surface1)"

[git_status]
style = "red bold bg:surface1"
format = "([](surface1)[ $all_status$ahead_behind ]($style)[](surface1))"

ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "~${count}"
deleted = "✕${count}"
staged = "+${count}"
untracked = "?${count}"
renamed = "»${count}"
conflicted = "!${count}"
stashed = "⚑${count}"

[git_metrics]
disabled = false
added_style = "green bold bg:surface1"
deleted_style = "red bold bg:surface1"
format = "[](surface1)[ +$added]($added_style)[ -$deleted ]($deleted_style)[](surface1)"

[nix_shell]
disabled = false
symbol = ""
heuristic = true
style = "crust bold bg:green"
format = "[](green)[ $symbol( $state) ]($style)[](green)"

[direnv]
disabled = false
symbol = ""
style = "crust bold bg:yellow"
format = "[](yellow)[ $symbol $loaded ]($style)[](yellow)"
allowed_msg = "on"
not_allowed_msg = "blocked"
denied_msg = "denied"
loaded_msg = "on"
unloaded_msg = "off"

################################################################################
# The connector
################################################################################

[fill]
symbol = " · "
style = "overlay0"

################################################################################
# Right side
################################################################################

[jobs]
symbol = "✦"
number_threshold = 1
symbol_threshold = 1
style = "peach bold bg:surface1"
format = "[](surface1)[ $symbol$number ]($style)[](surface1)"

[status]
disabled = false
symbol = "✘"
map_symbol = false  # keep the nerd-font look, not emoji
pipestatus = true
style = "crust bold bg:red"
format = "[](red)[ $symbol $status ]($style)[](red)"

[cmd_duration]
min_time = 1000
show_milliseconds = false
style = "peach bold bg:surface1"
format = "[](surface1)[ 󱎫 $duration ]($style)[](surface1)"

[time]
disabled = false
time_format = "%H:%M"
style = "crust bold bg:magenta"
format = "[](magenta)[ 󰥔 $time ]($style)[](magenta)"

################################################################################
# Prompt
################################################################################

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](lavender bold)"
vimcmd_replace_symbol = "[❮](red bold)"
vimcmd_visual_symbol = "[❮](yellow bold)"

################################################################################
# Languages
#
# Each one appears only inside a matching project, so the right side stays
# empty most of the time.
################################################################################

[c]
disabled = false
symbol = " "
style = "blue bold bg:surface1"
format = "[](surface1)[ $symbol($version) ]($style)[](surface1)"

[golang]
disabled = false
symbol = " "
style = "blue bold bg:surface1"
format = "[](surface1)[ $symbol($version) ]($style)[](surface1)"

[java]
disabled = false
symbol = " "
style = "red bold bg:surface1"
format = "[](surface1)[ $symbol($version) ]($style)[](surface1)"

[lua]
disabled = false
symbol = " "
style = "blue bold bg:surface1"
format = "[](surface1)[ $symbol($version) ]($style)[](surface1)"

[nodejs]
disabled = false
symbol = " "
style = "green bold bg:surface1"
format = "[](surface1)[ $symbol($version) ]($style)[](surface1)"

[python]
disabled = false
symbol = " "
style = "yellow bold bg:surface1"
format = "[](surface1)[ $symbol($version)(\\($virtualenv\\)) ]($style)[](surface1)"

[rust]
disabled = false
symbol = " "
style = "red bold bg:surface1"
format = "[](surface1)[ $symbol($version) ]($style)[](surface1)"

[docker_context]
disabled = false
symbol = " "
style = "blue bold bg:surface1"
format = "[](surface1)[ $symbol$context ]($style)[](surface1)"

################################################################################
# Disabled modules
################################################################################

[username]
disabled = true

[hostname]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

[package]
disabled = true

[kubernetes]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[terraform]
disabled = true
