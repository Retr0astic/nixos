"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
palette = "noctalia"

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time
$character
"""

################################################################################
# Directory
################################################################################

[directory]
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1
style = "black bold bg:blue"
format = "[](blue)[ $path]($style)[ ](blue)"
read_only = ""

################################################################################
# Git
################################################################################

[git_branch]
symbol = " "
style = "white bold bg:bright-black"
format = "[](bright-black)[ $symbol$branch ]($style)[ ](bright-black)"

[git_status]
style = "yellow bold bg:black"
format = "([](black)[ $all_status$ahead_behind ]($style)[ ](black))"

ahead = "⇡"
behind = "⇣"
diverged = "⇕"
modified = "~"
deleted = "✕"
staged = "+"
untracked = "?"
renamed = "»"
conflicted = "!"

################################################################################
# Right side
################################################################################

[fill]
symbol = " "

[cmd_duration]
min_time = 1000
style = "white bg:black"
format = "[](black)[󱎫 $duration ]($style)[ ](black)"

[time]
disabled = false
time_format = "%H:%M"
style = "white bold bg:magenta"
format = "[](magenta)[󰥔 $time ]($style)[](magenta)"

################################################################################
# Prompt
################################################################################

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold magenta)"

################################################################################
# Nix
################################################################################

[nix_shell]
disabled = false
symbol = " "
style = "black bold bg:green"
format = "[](green)[ $symbol$name ]($style)[ ](green)"

################################################################################
# Disabled modules
################################################################################

[username]
disabled = true

[hostname]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[c]
disabled = true

[package]
disabled = true

[docker_context]
disabled = true

[kubernetes]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[terraform]
disabled = true
