[audio]
enable_sounds = true

[bar.widgets]
auto_hide = true
capsule = true
capsule_border = "primary"
capsule_fill = "on_primary"
capsule_foreground = "tertiary"
center = [ "audio_visualizer", "active_window", "media" ]
color = "tertiary"
contact_shadow = true
end = [ "tray", "notifications", "clipboard", "bluetooth", "volume", "control-center", "session" ]
icon_color = "secondary"
margin_edge = 5
margin_ends = 800
reserve_space = false
thickness = 30

