[plugin_settings."noctalia/wallhaven"]
download_dir = ""

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
screen_time_enabled = true

    [shell.screenshot]
    directory = "/home/sree/Pictures/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Ayu Red"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    community_ids = [
        "spicetify",
        "zen-browser",
        "neovim",
        "vscode",
        "discord",
        "heroiclauncher",
        "steam",
        "telegram",
        "yazi",
        "zathura",
        "hyprtoolkit"
    ]

[wallpaper]
directory = "/home/sree/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/sree/Pictures/Wallpapers/Arcane S1 Jinx Walking.jpg"

    [wallpaper.last]
    path = "/home/sree/Pictures/Wallpapers/Arcane S1 Jinx Walking.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/sree/Pictures/Wallpapers/Arcane S1 Jinx Walking.jpg"

    [wallpaper.monitors.DP-5]
