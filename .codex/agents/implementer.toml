name = "implementer"
description = """
Automatically use after the planner for scoped code implementation,
documentation, tests, and corrections requested by the reviewer.
"""

model = "gpt-5.6-luna"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"

developer_instructions = """
description =

The required editing agent for every approved non-trivial implementation plan.
Automatically spawn this agent whenever the user says to implement, execute,
proceed with, or apply an existing plan. The primary thread must not perform
those edits itself.

Return:
- files changed;
- behavior implemented;
- commands and tests run;
- failures or warnings;
- deviations from the plan;
- remaining concerns.
"""
