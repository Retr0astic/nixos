name: Nix flake

on:
  pull_request:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.variants.outputs.list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # Build a variant only when its toplevel is not in the chapel cache.
      # Nix derives the output path from every input, so this needs no list
      # of paths per variant, and a new variant is picked up by name. A build
      # that failed pushed no toplevel, so the next run builds it again.
      # workflow_dispatch builds everything.
      - name: Select build variants
        id: variants
        shell: bash
        run: |
          set -euo pipefail
          list='[]'
          names=$(nix eval --json --apply builtins.attrNames .#nixosConfigurations)
          for v in $(jq -r '.[]' <<<"$names"); do
            out=$(nix eval --raw \
              ".#nixosConfigurations.$v.config.system.build.toplevel.outPath")
            if [ "${{ github.event_name }}" = workflow_dispatch ] ||
              ! nix path-info --store https://chapel.cachix.org "$out" >/dev/null 2>&1; then
              list=$(jq -c --arg v "$v" '. + [$v]' <<<"$list")
            else
              echo "$v: cached, skipped"
            fi
          done
          echo "list=$list" >>"$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: chapel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Check flake
        run: nix flake check --print-build-logs --accept-flake-config

      # A rename or a lost alias breaks every rebuild command that names it.
      # Only the names a person or a document actually passes to
      # `nixos-rebuild` are required:
      #   bigrig, chapel                    a bare `--flake ~/nixos` resolves by hostname
      #   chapel-caelestia, chapel-umbriel  README.md and docs/GUIDE.md
      # An extra name passes. Only a missing name fails, so adding a host
      # does not break CI on an unrelated pull request.
      - name: Verify configuration names
        shell: bash
        run: |
          set -euo pipefail
          required='["bigrig","chapel","chapel-caelestia","chapel-umbriel"]'

          actual=$(nix eval --json \
            --accept-flake-config \
            --apply 'builtins.attrNames' \
            .#nixosConfigurations)

          missing=$(jq -c --argjson actual "$actual" '. - $actual' <<<"$required")
          if [ "$missing" != "[]" ]; then
            echo "::error::missing nixosConfigurations: $missing"
            echo "present: $actual"
            exit 1
          fi

  build:
    needs:
      - check
      - changes
    # An empty matrix fails the job, so skip it when every variant is cached.
    if: needs.changes.outputs.variants != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.changes.outputs.variants) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: chapel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build ${{ matrix.variant }} toplevel
        run: |
          nix build \
            --accept-flake-config \
            .#nixosConfigurations.${{ matrix.variant }}.config.system.build.toplevel \
            --no-link \
            --print-build-logs

      - name: Push to Cachix
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          out=$(nix eval --raw --accept-flake-config \
            .#nixosConfigurations.${{ matrix.variant }}.config.system.build.toplevel.outPath)
          nix-store --query --requisites "$out" | cachix push chapel

  # Fast-forward `main` to the `testing` commit this run checked and built.
  # bigrig follows `main`, so a commit reaches the server only after CI
  # passes on it. chapel follows `testing` and gets it first.
  #
  # The push is a plain fast-forward. If `main` has a commit that `testing`
  # lacks, the push fails and the job goes red. Merge `main` into `testing`
  # to fix it.
  #
  # With FLAKE_UPDATE_TOKEN the push to `main` starts this workflow again.
  # Every toplevel is already in the cache, so that run builds nothing.
  promote:
    needs:
      - changes
      - check
      - build
    # `build` is skipped when every variant is cached. That still counts as
    # a pass.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/testing'
      && needs.changes.result == 'success'
      && needs.check.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fast-forward main
        run: git push origin "${{ github.sha }}:refs/heads/main"
