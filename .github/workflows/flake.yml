name: Nix flake

on:
  pull_request:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      caelestia: ${{ steps.filter.outputs.caelestia != 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            caelestia:
              - 'modules/shells/caelestia.nix'
              - 'modules/desktops/hyprland.nix'
              - 'modules/desktops/hyprland/**'
              - 'flake.lock'
              - '.github/workflows/flake.yml'

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: chapel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Check flake
        run: nix flake check --print-build-logs --accept-flake-config

      - name: Verify Chapel alias
        shell: bash
        run: |
          noctalia=$(nix eval --raw \
            --accept-flake-config \
            .#nixosConfigurations.noctalia-hyprland.config.system.build.toplevel.drvPath)

          alias=$(nix eval --raw \
            --accept-flake-config \
            .#nixosConfigurations.noctalia.config.system.build.toplevel.drvPath)

          test "$noctalia" = "$alias"

      - name: Verify Caelestia alias
        shell: bash
        run: |
          caelestia=$(nix eval --raw \
            --accept-flake-config \
            .#nixosConfigurations.caelestia-hyprland.config.system.build.toplevel.drvPath)

          alias=$(nix eval --raw \
            --accept-flake-config \
            .#nixosConfigurations.caelestia.config.system.build.toplevel.drvPath)

          test "$caelestia" = "$alias"

  build-chapel:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: chapel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build Chapel toplevel
        run: |
          nix build \
            --accept-flake-config \
            .#nixosConfigurations.chapel.config.system.build.toplevel \
            --no-link \
            --print-build-logs

      - name: Push to Cachix
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          out=$(nix eval --raw --accept-flake-config \
            .#nixosConfigurations.chapel.config.system.build.toplevel.outPath)
          nix-store --query --requisites "$out" | cachix push chapel

  build-caelestia:
    needs:
      - check
      - changes
    if: needs.changes.outputs.caelestia == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: chapel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build Caelestia toplevel
        run: |
          nix build \
            --accept-flake-config \
            .#nixosConfigurations.caelestia-hyprland.config.system.build.toplevel \
            --no-link \
            --print-build-logs

      - name: Push to Cachix
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          out=$(nix eval --raw --accept-flake-config \
            .#nixosConfigurations.caelestia-hyprland.config.system.build.toplevel.outPath)
          nix-store --query --requisites "$out" | cachix push chapel
