name: Nix flake

on:
  pull_request:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Check flake
        run: nix flake check --print-build-logs --accept-flake-config

      - name: Verify Chapel alias
        shell: bash
        run: |
          canonical=$(nix eval --raw \
            --accept-flake-config \
            .#nixosConfigurations.chapel-hyprland-noctalia.config.system.build.toplevel.drvPath)

          alias=$(nix eval --raw \
            --accept-flake-config \
            .#nixosConfigurations.chapel.config.system.build.toplevel.drvPath)

          test "$canonical" = "$alias"

      - name: Build Chapel toplevel
        run: |
          nix build \
            --accept-flake-config \
            .#nixosConfigurations.chapel.config.system.build.toplevel \
            --no-link \
            --print-build-logs
