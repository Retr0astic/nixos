name: Accept updates

# The browser front end for `accept-updates`. Actions tab -> Accept updates ->
# Run workflow. One button instead of one merge per pull request, and it works
# from the GitHub mobile app as well.
#
# It runs the same script the terminal alias runs
# (modules/packages/_accept-updates/accept-updates.sh), so the two front ends
# cannot drift apart: read which inputs the open pull requests carry, bump them
# all in a single `nix flake update`, evaluate both hosts, push one commit to
# testing, then close the pull requests it applied.
#
# The FLAKE_UPDATE_TOKEN secret is required. A push made with GITHUB_TOKEN
# starts no other workflow, so flake.yml would never build the result and
# `promote` would wait for a run that never appears.

on:
  workflow_dispatch:
    inputs:
      skip_high:
        description: "Leave lane:high pull requests open"
        type: boolean
        required: false
        default: false
      promote:
        description: "Move main too, once CI on testing is green"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: accept-updates
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-24.04
    # `promote` waits for the full flake.yml build on testing, which is the
    # long pole.
    timeout-minutes: 120

    steps:
      - name: Check out testing
        uses: actions/checkout@v7
        with:
          ref: testing
          fetch-depth: 0
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: chapel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Accept the open updates
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          ACCEPT_UPDATES_CHECKOUT: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.skip_high }}" = "true" ]; then
            args+=(--skip-high)
          fi
          if [ "${{ inputs.promote }}" = "true" ]; then
            args+=(--promote)
          fi
          nix run --accept-flake-config .#accept-updates -- "${args[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
